<style>
/* Layout: 全面ビュー。左端=縦スライダー、右端=レイヤー（常時表示）、下=ブラシ棚。親指で届く位置に操作を集める */
:root {
  --bg: #15171b;
  --panel: rgba(28, 31, 37, .92);

  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, monospace;
  --layers-w: 128px;
  --bar-h: 64px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
#bar, #top { min-width: 0; }

/* top bar */
#top { display: flex; align-items: center; gap: 4px; background: var(--panel-solid); border-bottom: 1px solid var(--line); padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.title { flex: 1; min-width: 0; font-weight: 600; letter-spacing: .05em; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.title small { color: var(--muted); font-weight: 400; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 38px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
.ib:active { background: var(--raise); }
.ib:disabled { opacity: .3; }
.ib svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* viewport */
#view { position: relative; min-height: 0; overflow: hidden; }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* layers (always visible) */
#layers { position: absolute; top: 10px; max-height: calc(100% - 100px); right: max(8px, env(safe-area-inset-right, 0px)); width: var(--layers-w); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; }
#layers header { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--line); }
#layers header span { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
#othersBtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto; margin-right: 4px; padding: 0; }
#othersBtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#othersBtn[data-mode="ghost"], #othersBtn[data-mode="hide"] { color: var(--cool); border-color: var(--cool); background: color-mix(in srgb, var(--cool) 16%, var(--panel-solid)); }
#addBtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
#layerList { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 3px; -webkit-overflow-scrolling: touch; }
.layer { display: grid; grid-template-columns: 12px minmax(0, 1fr) 30px; align-items: center; gap: 6px; min-height: 42px; padding: 0 2px 0 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.layer.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

.layer .eye svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.layer.hiddenL .nm, .layer.hiddenL .dot { opacity: .4; }
#layers footer { padding: 6px 8px; border-top: 1px solid var(--line); font-size: 10px; color: var(--muted); line-height: 1.4; }

/* horizontal sliders (top strip) */
#params { display: flex; gap: 14px; background: var(--panel-solid); border-bottom: 1px solid var(--line); padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* quick toggles */
#quick { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.qt { min-width: 56px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.qt[aria-pressed="true"] { border-color: var(--cool); color: var(--cool); background: color-mix(in srgb, var(--cool) 16%, var(--panel-solid)); }
.qt.hold[data-active="true"] { border-color: var(--fg); background: var(--raise); }

.symrow { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px 4px 3px 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.symrow span { font-size: 10px; color: var(--muted); margin-right: 2px; }

#lassoSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

#lassoSvg path.inv { fill: color-mix(in srgb, var(--cool) 16%, transparent); stroke: var(--cool); }
#lassoSvg path.cut { fill: color-mix(in srgb, var(--danger) 18%, transparent); stroke: var(--danger); }
#lassoSvg path.cut.inv { fill: color-mix(in srgb, var(--cool) 16%, transparent); stroke: var(--cool); }

#placeBar { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); right: 96px; bottom: 10px; display: flex; align-items: center; gap: 8px; background: var(--panel-solid); border: 1px solid var(--accent); border-radius: 12px; padding: 8px 8px 8px 12px; font-size: 12px; line-height: 1.5; z-index: 5; }
#placeBar { flex-direction: column; align-items: stretch; }
#outBar { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); right: 96px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel-solid); border: 1px solid var(--cool); border-radius: 12px; padding: 8px 8px 8px 12px; font-size: 12px; line-height: 1.5; z-index: 5; }
#outBar .prow { display: flex; align-items: center; gap: 8px; }

#placeBar button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
#placeBar button { flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; }
#sheet textarea { width: 100%; min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; font-size: 18px; resize: vertical; -webkit-user-select: text; user-select: text; color: var(--fg); font-family: var(--font-ui); }
.sb.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

#frontBtn, #projBtn, #pivotBtn, #maskBtn { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); top: 10px; width: 44px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

#maskBtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

#favs button { position: relative; width: 44px; height: 44px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9.5px; line-height: 1.1; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 0 1px; overflow: hidden; }

.tgw { position: relative; }

#orbitPad { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--muted); touch-action: none; cursor: grab; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); -webkit-touch-callout: none; }

#brushes { align-items: stretch; }

async function loadMyStamps() { const r = await idbTx('readonly', (st) => st.get('mystamps')); return Array.isArray(r) ? r : []; }

  const im = new Image();
  im.onload = () => {
    if (stampSt.src === 'draw') { // put it on the drawing pad as well, so it can be edited

    if (state.tf) setTf(false);
    if (state.active?.sm.hasMask()) { maskAction('clear'); return; }
    if (state.brush === 'mask' || state.brush === 'lasso') { selectBrush(state.prevMaskOff || 'grab'); toast('マスクをやめて「' + brushLabel(state.brush) + '」に戻りました'); return; }
    maskAction('mask');
  };
  b.addEventListener('pointerup', (e) => up(e, false)); b.addEventListener('pointercancel', (e) => up(e, true));
  b.onclick = (e) => e.preventDefault();
  pop.querySelectorAll('[data-mk]').forEach((x) => (x.onclick = () => { if (suppress) return; pop.hidden = true; maskAction(x.dataset.mk); }));
  document.addEventListener('pointerdown', (e) => { if (!pop.hidden && !pop.contains(e.target) && e.target !== b && !b.contains(e.target)) pop.hidden = true; });
  paintMaskBtn();
})();

// ---------- trim tool: draw a straight line, cut along it in the direction you are looking ----------
const lineTrim = { on: false, a: null, b: null, rec: null, n: null, c: 0, vis: null };
function drawTrimLine() {
  const svg = $('lassoSvg'); const r = canvas.getBoundingClientRect();
  if (!lineTrim.a) { if (!gesture?.lasso) svg.innerHTML = ''; return; }
  const [ax, ay] = lineTrim.a, [bx, by] = lineTrim.b;
  svg.innerHTML = `<line x1="${ax - r.left}" y1="${ay - r.top}" x2="${bx - r.left}" y2="${by - r.top}"/>`;
}
function finishTrimLine() {
  const a = lineTrim.a, b = lineTrim.b; lineTrim.a = null; drawTrimLine();
  const rec = state.active; if (!rec || !a || Math.hypot(b[0] - a[0], b[1] - a[1]) < 24) return false; // 短いのはタップ扱い（レイヤー選択など）
  // 線の2点を通り、見ている向きに沿った平面
  const r1 = setRay({ clientX: a[0], clientY: a[1] }).clone(), r2 = setRay({ clientX: b[0], clientY: b[1] }).clone();
  const P1 = r1.at(1, new V3()), P2 = r2.at(1, new V3()), P3 = r1.at(500, new V3());
  const n = P2.clone().sub(P1).cross(P3.clone().sub(P1)).normalize(); if (!isFinite(n.x) || n.lengthSq() < 0.5) { toast('線を読み取れませんでした', 'err'); return true; }
  let c = -n.dot(P1);
  // 形の多いほうを残す（あとで反対にできる）
  const sm = rec.sm; rec.mesh.updateMatrixWorld(true); const M = rec.mesh.matrixWorld; const w = new V3(); let pos = 0, neg = 0;
  for (let v = 0; v < sm.nV; v += Math.max(1, (sm.nV / 4000) | 0)) { w.set(sm.pos[v * 3], sm.pos[v * 3 + 1], sm.pos[v * 3 + 2]).applyMatrix4(M); if (n.dot(w) + c >= 0) pos++; else neg++; }
  if (!pos || !neg) { toast('線が形を横切っていません', 'err'); return true; }
  if (neg > pos) { n.negate(); c = -c; }
  startLineTrim(rec, n, c); return true;
}
function startLineTrim(rec, n, c) {
  if (lineTrim.rec && lineTrim.rec !== rec) { lineTrim.rec.mesh.material.clippingPlanes = null; lineTrim.rec.mesh.material.needsUpdate = true; }
  lineTrim.on = true; lineTrim.rec = rec; lineTrim.n = n; lineTrim.c = c;
  if (!lineTrim.vis) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x6cc3dc, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false }));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)), new THREE.LineBasicMaterial({ color: 0x6cc3dc })));
    m.renderOrder = 5; lineTrim.vis = m; scene.add(m);
  }
  paintLineTrim();
  $('ltBar').hidden = false; $('quick').hidden = true;
}
function paintLineTrim() {
  const { rec, n, c } = lineTrim; const plane = lineTrim.plane || (lineTrim.plane = new THREE.Plane()); plane.set(n, c);
  rec.mesh.material.clippingPlanes = [plane]; rec.mesh.material.clipShadows = false; rec.mesh.material.needsUpdate = true;
  const b = worldBox(rec); const ctr = b.getCenter(new V3()); const sz = b.getSize(new V3()).length() * 1.15;
  const v = lineTrim.vis; v.visible = true; v.position.copy(ctr).addScaledVector(n, -(n.dot(ctr) + c)); v.quaternion.setFromUnitVectors(new V3(0, 0, 1), n); v.scale.set(sz, sz, 1);
  $('ltInfo').textContent = `「${rec.name}」を線で切ります。見えている側が残ります（2本指で視点を変えて確かめられます）。引き直すこともできます`;
}
function endLineTrim() {
  if (lineTrim.rec) { lineTrim.rec.mesh.material.clippingPlanes = null; lineTrim.rec.mesh.material.needsUpdate = true; }
  lineTrim.on = false; lineTrim.rec = null; if (lineTrim.vis) lineTrim.vis.visible = false;
  $('ltBar').hidden = true; $('quick').hidden = false;
}
$('ltFlip').onclick = () => { if (!lineTrim.on) return; lineTrim.n.negate(); lineTrim.c = -lineTrim.c; paintLineTrim(); };
$('ltCancel').onclick = endLineTrim;
$('ltGo').onclick = () => { if (!lineTrim.on) return; const r = lineTrim.rec, n = lineTrim.n.toArray(), c = lineTrim.c; endLineTrim(); applyVoxel('トリム', r, null, 'remesh', { cutPlane: { n, c } }); };

// ---------- favourite tools (left column, under the mask button) ----------
var FAV_MAX = 4;
var favs = ['draw', 'clay']; // var: ツール棚の描画が先に呼ぶため
try { const v = JSON.parse(localStorage.getItem('nendo-favs') || 'null'); if (Array.isArray(v)) favs = v.filter((k) => ICON[k] && TOOL_LIST().some((b) => b[0] === k)).slice(0, FAV_MAX); } catch {}
function toggleFav(k) {
  if (favs.includes(k)) { favs = favs.filter((x) => x !== k); toast(`「${brushLabel(k)}」を左の列から外しました`); }
  else { if (favs.length >= FAV_MAX) { toast(`左の列に置けるのは${FAV_MAX}つまでです。どれかの★を外してください`, 'err'); return; } favs.push(k); toast(`「${brushLabel(k)}」を左の列に置きました`, 'ok'); }
  try { localStorage.setItem('nendo-favs', JSON.stringify(favs)); } catch {}
  renderFavs();
}
function renderFavs() {
  const el = $('favs'); if (!el || !favs) return; el.innerHTML = '';
  for (const k of favs) {
    const b = document.createElement('button'); const inv = !!(state.invB[k] && INV_NAMES[k]);
    b.className = inv ? 'inverted' : ''; b.setAttribute('aria-pressed', state.brush === k); b.setAttribute('aria-label', brushLabel(k));
    b.innerHTML = `<svg viewBox="0 0 24 24">${ICON[k]}</svg><span>${brushLabel(k)}</span>` + (k === 'paint' ? `<i class="pdot" style="background:#${state.paintHex.toString(16).padStart(6, '0')};right:6px;bottom:6px"></i>` : '');
    b.onclick = () => { if (state.tf) setTf(false); selectBrush(k); };
    el.append(b);
  }
}
renderFavs();

// ---------- reorder layers by press-and-drag ----------
try { for (const k of ['penStr', 'penSize']) { const v = localStorage.getItem('nendo-' + k); if (v !== null) state[k] = v === '1'; } } catch {}
function attachLayerDrag(row, r) {
  row.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.eye')) return;
    const pid = e.pointerId, sy = e.clientY; let lastY = sy, mode = 'wait', drag = null;
    const timer = setTimeout(() => {
      if (mode !== 'wait') return; mode = 'drag';
      drag = { list: $('layerList'), before: listSnap(), act: state.active };
      row.classList.add('dragging'); navigator.vibrate?.(10);
    }, 280);
    const move = (ev) => {
      if (ev.pointerId !== pid) return;
      if (mode === 'wait' && Math.abs(ev.clientY - sy) > 8) { clearTimeout(timer); mode = 'scroll'; row._dragged = true; }
      if (mode === 'scroll') { $('layerList').scrollTop -= ev.clientY - lastY; lastY = ev.clientY; return; } // rows use touch-action: none, so scroll by hand
      if (mode !== 'drag') return;
      ev.preventDefault();
      for (const o of drag.list.querySelectorAll('.layer')) {
        if (o === row) continue; const b = o.getBoundingClientRect();
        if (ev.clientY > b.top && ev.clientY < b.bottom) { if (ev.clientY < b.top + b.height / 2) drag.list.insertBefore(row, o); else drag.list.insertBefore(row, o.nextSibling); break; }
      }
    };
    const up = (ev) => {
      if (ev.pointerId !== pid) return;
      clearTimeout(timer); window.removeEventListener('pointermove', move, true); window.removeEventListener('pointerup', up, true); window.removeEventListener('pointercancel', up, true);
      if (mode === 'scroll') { setTimeout(() => (row._dragged = false), 60); return; }
      if (mode !== 'drag') return;
      row.classList.remove('dragging'); row._dragged = true; setTimeout(() => (row._dragged = false), 60);
      const ids = [...drag.list.querySelectorAll('.layer')].map((x) => +x.dataset.id).reverse();
      const order = ids.map((id) => state.objects.find((o) => o.id === id)).filter(Boolean);
      if (order.length === state.objects.length && order.some((o, i) => o !== state.objects[i])) {
        state.objects = order; const after = listSnap(), a = state.active, b = drag.before, act = drag.act;
        pushUndo('順番を変更', { undo: () => listRestore(b, act), redo: () => listRestore(after, a) });
        toast('レイヤーの順番を変えました');
      }
      renderLayers();
    };
    window.addEventListener('pointermove', move, true); window.addEventListener('pointerup', up, true); window.addEventListener('pointercancel', up, true);
  });
}
