<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>枕よけsh！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  :root{
    --night:#1B1230;
    --plum:#2A1B45;
    --plum-lite:#3B2860;
    --cream:#FDF3E3;
    --cream-dim:rgba(253,243,227,.62);
    --pink:#F2A0C0;
    --pink-deep:#C2687F;
    --matcha:#D9EAA6;
    --gold:#FFD166;
    --stitch:rgba(253,243,227,.45);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, #37225C 0%, rgba(55,34,92,0) 60%),
      radial-gradient(900px 600px at 100% 110%, #4A2A54 0%, rgba(74,42,84,0) 55%),
      var(--night);
    color:var(--cream);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",system-ui,sans-serif;
    display:flex;
    justify-content:center;
    padding:clamp(14px,3vw,34px);
  }
  .frame{width:min(100%,1020px);display:flex;flex-direction:column;gap:clamp(12px,2vw,18px)}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{
    font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
    font-size:clamp(26px,5vw,44px);
    margin:0;line-height:1.1;text-wrap:balance;
    color:var(--cream);
    text-shadow:0 3px 0 var(--pink-deep), 0 0 26px rgba(242,160,192,.35);
  }
  h1 .accent{color:var(--pink)}
  .tag{
    font-size:clamp(12px,1.6vw,14px);color:var(--cream-dim);
    letter-spacing:.1em;margin:6px 0 0;
  }
  .sound-btn{
    font-family:inherit;font-size:14px;font-weight:700;color:var(--cream);
    background:var(--plum);border:2px solid rgba(253,243,227,.28);border-radius:999px;
    padding:9px 18px;cursor:pointer;transition:border-color .15s,transform .1s;
  }
  .sound-btn:hover{border-color:var(--pink)}
  .sound-btn:active{transform:translateY(1px)}
  .sound-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  .stage{
    position:relative;width:100%;aspect-ratio:960/600;
    border-radius:26px;overflow:hidden;
    background:var(--plum);
    border:3px solid var(--pink);
    box-shadow:0 0 0 7px var(--plum), 0 0 0 9px rgba(242,160,192,.28), 0 26px 50px rgba(0,0,0,.5);
  }
  /* pillow-seam stitching around the play field */
  .stage::after{
    content:"";position:absolute;inset:10px;border-radius:18px;
    border:2px dashed var(--stitch);pointer-events:none;opacity:.5;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .overlay{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(27,18,48,.78);
    padding:20px;text-align:center;
  }
  .overlay[hidden]{display:none}
  .card{
    max-width:min(90%,520px);
    background:linear-gradient(180deg,var(--plum-lite),var(--plum));
    border:2px dashed var(--stitch);border-radius:22px;
    padding:clamp(18px,3.4vw,30px) clamp(20px,4vw,38px);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .card h2{
    font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
    font-size:clamp(22px,4vw,34px);margin:0 0 10px;color:var(--pink);
  }
  .card p{margin:0 0 6px;font-size:clamp(13px,1.9vw,16px);line-height:1.75;color:var(--cream)}
  .card p.sub{color:var(--cream-dim);font-size:clamp(12px,1.7vw,14px)}
  .keys{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
  .key{
    font-size:13px;font-weight:700;padding:6px 12px;border-radius:9px;
    background:var(--night);border:2px solid rgba(253,243,227,.3);
  }
  .scoreline{
    display:flex;gap:26px;justify-content:center;margin:14px 0 4px;
    font-variant-numeric:tabular-nums;
  }
  .scoreline div{display:flex;flex-direction:column;gap:2px}
  .scoreline span{font-size:11px;letter-spacing:.16em;color:var(--cream-dim)}
  .scoreline strong{font-family:"Mochiy Pop One",sans-serif;font-size:clamp(24px,4.5vw,34px);color:var(--gold);line-height:1}
  .start-btn{
    display:block;margin:16px auto 0;font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
    font-size:clamp(15px,2.4vw,19px);color:var(--night);
    background:var(--pink);border:none;border-radius:999px;
    padding:13px 34px;cursor:pointer;
    box-shadow:0 5px 0 var(--pink-deep);
    transition:transform .1s,box-shadow .1s;
  }
  .start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--pink-deep)}
  .start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
  .start-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  .footpad{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .hint{font-size:13px;color:var(--cream-dim);line-height:1.7}
  .hint b{color:var(--matcha);font-weight:700}
  .pad{display:flex;gap:12px}
  .pad button{
    width:74px;height:56px;border-radius:16px;cursor:pointer;
    background:var(--plum);color:var(--cream);
    border:2px solid rgba(253,243,227,.28);
    font-size:22px;line-height:1;
    touch-action:none;
  }
  .pad button:active{background:var(--plum-lite);border-color:var(--pink)}
  .pad button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media (hover:hover) and (pointer:fine){ .pad{display:none} }
  /* the play field is short on a phone — keep the panels inside it */
  @media (max-width:640px){
    .overlay{padding:8px}
    .card{padding:12px 16px;border-radius:14px}
    .card h2{font-size:19px;margin-bottom:5px}
    .card p{font-size:11.5px;line-height:1.55;margin-bottom:2px}
    .card p.sub{display:none}
    .keys{margin:7px 0 0;gap:6px}
    .key{padding:3px 9px;font-size:11px}
    .scoreline{margin:8px 0 0;gap:18px}
    .scoreline strong{font-size:21px}
    .scoreline span{font-size:9px}
    .start-btn{margin:9px auto 0;padding:9px 22px;font-size:14px}
    .stage{border-radius:18px}
    .stage::after{inset:6px;border-radius:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .start-btn,.sound-btn{transition:none}
  }
</style>

</head>
<body>
<div class="frame">
  <header>
    <div>
      <h1>枕<span class="accent">よけsh</span>！</h1>
      <p class="tag">Save the goats!</p>
    </div>
    <button class="sound-btn" id="sound" type="button" aria-pressed="true">♪ 音：オン</button>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="footpad">
    <p class="hint">
      左から飛んでくる枕が<b>顔に当たらない</b>ように、上下キーでよけよう。<br>
      よけるほどスコアが伸びて、枕の速度もどんどん上がります。ライフは3つ。<br>
      たまに<b>1.5〜3倍の大きな枕</b>が飛んできます。大きいほどゆっくりですが、当たり判定も大きいので要注意。
    </p>
    <div class="pad">
      <button id="btnUp" type="button" aria-label="上へ移動">▲</button>
      <button id="btnDown" type="button" aria-label="下へ移動">▼</button>
    </div>
  </div>
</div>

  var VW = 960, VH = 600;
  var CH = 300, CW = CH * 384 / 560;         // character draw size
  var CHAR_X = VW - CW - 56;
  var FACE = { x0:0.380, x1:0.771, y0:0.052, y1:0.314 };  // face box within the sprite
  var MOVE_SPEED = 460;
  var PILLOW_R = 27, PILLOW_W = 66;

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var overlay = document.getElementById("overlay");
  var card = document.getElementById("card");
  var soundBtn = document.getElementById("sound");

  var chara = new Image(); chara.src = IMG_CHARA;
  var flashCv = null;                       // white silhouette used for the blast flash
  var pillowImg = new Image(); pillowImg.src = IMG_PILLOW;

  var scale = 1;
  function fit(){
    var rect = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(rect.width * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
    scale = cv.width / VW;
  }
  window.addEventListener("resize", fit);

  // ---------- stars ----------
  var stars = [];
  for (var i = 0; i < 60; i++){
    stars.push({ x: Math.random()*VW, y: Math.random()*VH*0.72, r: Math.random()*1.7+0.5, p: Math.random()*Math.PI*2 });
  }

  // ---------- audio ----------
  var audioOn = true, actx = null;
  function ensureAudio(){
    if (!audioOn) return null;
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo){
    var a = ensureAudio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.09, a.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function noise(dur, vol, freq){
    var a = ensureAudio(); if (!a) return;
    var len = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var src = a.createBufferSource(); src.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 900;
    var g = a.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  }
  var sfx = {
    throw_: function(sc){
      sc = sc || 1;
      noise(0.16 * sc, 0.05 * sc, 1500 / sc);
      if (sc >= 2) tone(90 * (3 / sc), 0.22, "sine", 0.05, 55);
    },
    dodge:  function(){ tone(880, 0.07, "triangle", 0.035, 1320); },
    hit:    function(){ noise(0.3, 0.22, 420); tone(150, 0.28, "sine", 0.16, 70); },
    level:  function(){ tone(660, 0.1, "square", 0.05); setTimeout(function(){ tone(990, 0.14, "square", 0.05); }, 95); },
    over:   function(){ tone(440, 0.5, "sawtooth", 0.08, 110); },
    boom:   function(){

      setTimeout(function(){ noise(0.5, 0.16, 160); }, 110);

  }

  function reset(){
    S.time = 0; S.charY = (VH - CH) / 2; S.dir = 0;
    S.pillows = []; S.puffs = []; S.sparks = []; S.boom = 0; S.gone = false;
    S.spawnIn = 1.1; S.score = 0; S.lives = 3; S.level = 1;
    S.invuln = 0; S.shake = 0; S.toast = 0; S.bob = 0;
  }

  var BOOM_LEN = 1.7;

  function pillowSpeed(){ return Math.min(1250, 330 + S.time * 13); }
  function spawnGap(){ return Math.max(0.40, 1.5 - S.time * 0.02); }

  // Size roulette: 1x normal, and 1.5x / 2x / 3x monsters that turn up more
  // often as the level climbs. A big one travels slower, in proportion to its size.
  function pickSize(){
    var lv = S.level;
    var p3  = Math.min(0.15, Math.max(0, (lv - 4) * 0.035));   // triples from level 5
    var p2  = Math.min(0.24, Math.max(0, (lv - 1) * 0.055));   // doubles from level 2
    var p15 = Math.min(0.34, 0.08 + lv * 0.045);
    var r = Math.random();
    if (r < p3) return 3;
    if (r < p3 + p2) return 2;
    if (r < p3 + p2 + p15) return 1.5;
    return 1;
  }
  function countBig(min){
    var n = 0;
    for (var i = 0; i < S.pillows.length; i++){ if (S.pillows[i].sc >= min) n++; }
    return n;
  }

  // Pillows are aimed at the face, but always slightly off-centre on one side,
  // so there is always a dodge direction with room to move into.
  function spawn(offset){
    var f = faceRect();
    var fc = f.y + f.h / 2;
    var roomUp = S.charY, roomDown = (VH - CH) - S.charY;

    var sc = pickSize();
    if (sc >= 2 && countBig(2) >= 1) sc = 1.5;          // never two monsters at once
    if (sc >= 1.5 && countBig(1.5) >= 2) sc = 1;        // and never more than two big ones
    var rad = PILLOW_R * sc;
    var mag = (18 + Math.random() * 34) * (0.55 + 0.45 * sc);
    var reach = f.h / 2 + rad - mag + 14;               // px she must move to clear it

    // aiming high means dodging down, and vice versa — pick a side she can escape to
    var canAimHigh = roomDown >= reach, canAimLow = roomUp >= reach;
    var side;
    if (canAimHigh && canAimLow) side = Math.random() < 0.5 ? -1 : 1;
    else if (canAimHigh) side = -1;
    else if (canAimLow) side = 1;
    else {                                              // cornered: send a normal one
      sc = 1; rad = PILLOW_R; mag = 18 + Math.random() * 34;
      side = roomDown > roomUp ? -1 : 1;
    }

    var y = fc + side * mag;
    if (sc === 1) y = Math.max(rad + 8, Math.min(VH - rad - 8, y));
    else y = Math.max(-rad * 0.35, Math.min(VH + rad * 0.35, y));

    S.pillows.push({
      x: -PILLOW_W * sc - (offset || 0),
      y: y,
      sc: sc,
      r: rad,
      vx: pillowSpeed() / Math.pow(sc, 0.9) * (0.94 + Math.random() * 0.12),
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() * 2 - 1) * 6 / sc,
      scored: false
    });
    sfx.throw_(sc);
  }

  function puffBurst(x, y, sc){
    sc = sc || 1;
    var n = Math.round((reduceMotion ? 6 : 16) * sc);
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 210) * (0.7 + 0.3 * sc);
      S.puffs.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40, life:0.7 + Math.random()*0.4, t:0, r:(3 + Math.random()*7) * Math.sqrt(sc) });
    }
  }

  // third hit: she goes up in a puff of feathers and fire
  function startBoom(){
    S.mode = "boom";
    S.gone = true;
    S.boom = BOOM_LEN;
    S.boomX = CHAR_X + CW / 2;
    S.boomY = S.charY + CH * 0.34;
    S.shake = reduceMotion ? 0.35 : 1.6;
    S.dir = 0;
    var n = reduceMotion ? 24 : 90;
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 90 + Math.random() * 620;
      S.sparks.push({
        x: S.boomX + (Math.random() * 2 - 1) * 30,
        y: S.boomY + (Math.random() * 2 - 1) * 60,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 130,
        r: 2 + Math.random() * 9,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() * 2 - 1) * 9,
        life: 0.8 + Math.random() * 0.9,
        t: 0,
        kind: i % 3 === 0 ? "feather" : "spark"
      });
    }
    puffBurst(S.boomX, S.boomY);
    sfx.boom();
  }

  // ---------- input ----------
  var held = { up:false, down:false };
  function syncDir(){ S.dir = (held.down ? 1 : 0) - (held.up ? 1 : 0); }
  window.addEventListener("keydown", function(e){
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W"){ held.up = true; syncDir(); e.preventDefault(); }
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S"){ held.down = true; syncDir(); e.preventDefault(); }
    else if (e.key === " " || e.key === "Enter"){
      if (S.mode !== "playing"){ startGame(); e.preventDefault(); }
    }
  });
  window.addEventListener("keyup", function(e){
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W"){ held.up = false; syncDir(); }
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S"){ held.down = false; syncDir(); }
  });
  function bindPad(id, key){
    var el = document.getElementById(id);
    var on = function(e){ held[key] = true; syncDir(); e.preventDefault(); };
    var off = function(){ held[key] = false; syncDir(); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }
  bindPad("btnUp", "up");
  bindPad("btnDown", "down");
  // drag / tap on the stage moves her too
  cv.addEventListener("pointerdown", dragMove);
  cv.addEventListener("pointermove", function(e){ if (e.buttons) dragMove(e); });
  function dragMove(e){
    if (S.mode !== "playing") return;
    var r = cv.getBoundingClientRect();
    var y = (e.clientY - r.top) / r.height * VH;
    S.charY = Math.max(0, Math.min(VH - CH, y - CH * 0.18));
  }

  // ---------- screens ----------
  function showTitle(){
    S.mode = "title";
    card.innerHTML =
      '<h2>枕よけsh！</h2>' +
      '<p>左からハート枕が顔めがけて飛んできます。<br>上下キーでよけ続けよう。</p>' +
      '<p class="sub">たまに飛んでくる大きな枕は、大きいほどゆっくり。レベルが上がるほど増えます。</p>' +
      '<div class="keys"><span class="key">↑</span><span class="key">↓</span></div>' +
      '<p class="sub">スマホは画面をなぞるか、下の▲▼ボタンで移動できます。</p>' +
      '<button class="start-btn" id="go" type="button">スタート</button>';
    overlay.hidden = false;
    document.getElementById("go").addEventListener("click", startGame);
  }
  function showOver(){
    S.mode = "over";
    S.best = Math.max(S.best, S.score);
    var msg = S.score >= 40 ? "枕マスター！" : S.score >= 20 ? "いい反射神経！" : "もう一回いこう！";
    card.innerHTML =
      '<h2>ゲームオーバー</h2>' +
      '<p>' + msg + '</p>' +
      '<div class="scoreline">' +
        '<div><span>SCORE</span><strong>' + S.score + '</strong></div>' +
        '<div><span>BEST</span><strong>' + S.best + '</strong></div>' +
        '<div><span>LEVEL</span><strong>' + S.level + '</strong></div>' +
      '</div>' +
      '<button class="start-btn" id="go" type="button">もう一度あそぶ</button>';
    overlay.hidden = false;
    document.getElementById("go").addEventListener("click", startGame);
    if (!S.gone) sfx.over();
  }
  function startGame(){
    ensureAudio();
    reset();
    S.mode = "playing";
    overlay.hidden = true;
  }

  // ---------- update ----------
  function updateParticles(dt){
    for (var j = S.puffs.length - 1; j >= 0; j--){
      var q = S.puffs[j];
      q.t += dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 520 * dt;
      if (q.t >= q.life) S.puffs.splice(j, 1);
    }
    for (var k = S.sparks.length - 1; k >= 0; k--){
      var s = S.sparks[k];
      s.t += dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vy += (s.kind === "feather" ? 180 : 640) * dt;
      s.vx *= (s.kind === "feather" ? 0.975 : 0.995);
      s.rot += s.vrot * dt;
      if (s.t >= s.life) S.sparks.splice(k, 1);
    }
  }

  function update(dt){
    if (S.mode === "boom"){
      S.bob += dt;
      S.boom -= dt;
      if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 1.5);
      for (var b = S.pillows.length - 1; b >= 0; b--){
        var bp = S.pillows[b];
        bp.x += bp.vx * dt; bp.rot += bp.vrot * dt;
        if (bp.x - bp.r > VW + 30) S.pillows.splice(b, 1);
      }
      updateParticles(dt);
      if (S.boom <= 0) showOver();
      return;
    }
    if (S.mode !== "playing"){
      S.bob += dt;
      updateParticles(dt);
      return;
    }
    S.time += dt;
    S.bob += dt;
    S.scroll = (S.scroll + pillowSpeed() * dt * 0.35) % 120;

    var lv = 1 + Math.floor(S.time / 12);
    if (lv > S.level){
      S.level = lv;
      S.toast = 1.6; S.toastText = "レベル " + lv + "　スピードアップ！";
      sfx.level();
    }

    S.charY += S.dir * MOVE_SPEED * dt;
    S.charY = Math.max(0, Math.min(VH - CH, S.charY));

    S.spawnIn -= dt;
    if (S.spawnIn <= 0){
      spawn(0);
      if (S.level >= 3 && Math.random() < 0.10 + S.level * 0.03) spawn(150 + Math.random() * 120);
      S.spawnIn = spawnGap();
    }

    if (S.invuln > 0) S.invuln -= dt;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.4);
    if (S.toast > 0) S.toast -= dt;

    var f = faceRect();
    for (var i = S.pillows.length - 1; i >= 0; i--){
      var p = S.pillows[i];
      p.x += p.vx * dt;
      p.rot += p.vrot * dt;

      if (S.invuln <= 0 && circleHitsRect(p.x, p.y, p.r, f)){
        S.pillows.splice(i, 1);
        puffBurst(p.x + 10, p.y, p.sc);
        S.lives--;
        S.invuln = 1.4;
        S.shake = reduceMotion ? 0.2 : 1;
        if (S.lives <= 0){ startBoom(); return; }
        sfx.hit();
        continue;
      }
      if (p.x - p.r > VW + 30){
        S.pillows.splice(i, 1);
        S.score++;
        sfx.dodge();
      } else if (!p.scored && p.x > CHAR_X + CW){
        p.scored = true;
      }
    }

    updateParticles(dt);
  }

  function circleHitsRect(cx, cy, r, rect){
    var nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    var ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  // ---------- draw ----------
  function drawBackground(){
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, "#2A1B45");
    g.addColorStop(0.55, "#3B2860");
    g.addColorStop(1, "#563066");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    // moon
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#FDF3E3";
    ctx.beginPath(); ctx.arc(330, 128, 38, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.arc(330, 128, 60, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // stars
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(S.bob * 1.6 + s.p));
      ctx.globalAlpha = tw * 0.8;
      ctx.fillStyle = "#FDF3E3";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // quilted floor
    var floorY = VH - 96;
    ctx.fillStyle = "#20163A";
    ctx.fillRect(0, floorY, VW, VH - floorY);
    ctx.strokeStyle = "rgba(253,243,227,.13)";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 9]);
    for (var x = -120 + (S.scroll % 60); x < VW + 120; x += 60){
      ctx.beginPath(); ctx.moveTo(x, floorY); ctx.lineTo(x + 60, VH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 60, floorY); ctx.lineTo(x, VH); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = "rgba(242,160,192,.5)";
    ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(VW, floorY); ctx.stroke();

    // speed streaks
    if (S.mode === "playing" && !reduceMotion){
      ctx.strokeStyle = "rgba(253,243,227,.07)";
      ctx.lineWidth = 3;
      for (var k = 0; k < 7; k++){
        var sy = 70 + k * 66;
        var sx = ((S.scroll * (1 + k % 3) * 1.4) % (VW + 260)) - 200;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 110, sy); ctx.stroke();
      }
    }
  }

  function drawPillow(p){
    var sc = p.sc || 1;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    var w = PILLOW_W * sc;
    var h = w * (pillowImg.naturalHeight || 107) / (pillowImg.naturalWidth || 110);
    ctx.shadowColor = sc >= 2 ? "rgba(255,209,102,.6)" : "rgba(242,160,192,.55)";
    ctx.shadowBlur = 18 * Math.sqrt(sc);
    if (pillowImg.complete) ctx.drawImage(pillowImg, -w / 2, -h / 2, w, h);
    ctx.restore();
    // motion trail — longer and heavier on the big ones
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = sc >= 2 ? "#FFD166" : "#F2A0C0";
    ctx.lineWidth = 4 * Math.sqrt(sc);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.x - 34 * sc, p.y - 6 * sc); ctx.lineTo(p.x - 78 * sc, p.y - 6 * sc);
    ctx.moveTo(p.x - 30 * sc, p.y + 12 * sc); ctx.lineTo(p.x - 62 * sc, p.y + 12 * sc);
    ctx.stroke();
    ctx.restore();
  }

  function drawChara(){
    var boomT = S.mode === "boom" ? BOOM_LEN - S.boom : -1;
    if (S.gone && S.mode !== "boom") return;     // she is not back until the next round
    if (boomT > 0.12) return;                    // she is gone — only the blast is left
    var blink = S.mode !== "boom" && S.invuln > 0 && Math.floor(S.invuln * 12) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.35 : 1;
    var tilt = S.mode === "playing" ? S.dir * 0.05 : Math.sin(S.bob * 1.4) * 0.02;
    var cxp = CHAR_X + CW / 2, cyp = S.charY + CH;
    ctx.translate(cxp, cyp);
    ctx.rotate(tilt);
    ctx.translate(-cxp, -cyp);
    // soft ground shadow — shrinks and fades as she rises
    var lift = 1 - (S.charY / (VH - CH));      // 1 = low, 0 = high
    var rw = CW * (0.16 + lift * 0.16), rh = 8 + lift * 7;
    var sg = ctx.createRadialGradient(cxp, VH - 74, 0, cxp, VH - 74, rw);
    sg.addColorStop(0, "rgba(12,6,26," + (0.30 + lift * 0.30).toFixed(2) + ")");
    sg.addColorStop(1, "rgba(12,6,26,0)");
    ctx.globalAlpha *= 0.9;
    ctx.fillStyle = sg;
    ctx.save();
    ctx.translate(cxp, VH - 74); ctx.scale(1, rh / rw); ctx.translate(-cxp, -(VH - 74));
    ctx.beginPath(); ctx.arc(cxp, VH - 74, rw, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = blink ? 0.35 : 1;
    if (chara.complete){
      if (boomT >= 0){
        // she flashes white-hot for a beat before blowing apart
        ctx.save();
        var pop = 1 + boomT * 1.6;
        ctx.translate(CHAR_X + CW / 2, S.charY + CH * 0.34);
        ctx.scale(pop, pop);
        ctx.translate(-(CHAR_X + CW / 2), -(S.charY + CH * 0.34));
        ctx.drawImage(chara, CHAR_X, S.charY, CW, CH);
        if (flashCv) ctx.drawImage(flashCv, CHAR_X, S.charY, CW, CH);
        ctx.restore();
      } else {
        ctx.drawImage(chara, CHAR_X, S.charY, CW, CH);
      }
    }
    ctx.restore();
  }

  function drawSparks(){
    var pw = 26, ph = 26 * (pillowImg.naturalHeight || 107) / (pillowImg.naturalWidth || 110);
    for (var i = 0; i < S.sparks.length; i++){
      var s = S.sparks[i];
      var k = Math.max(0, 1 - s.t / s.life);
      ctx.globalAlpha = k;
      if (s.kind === "feather"){
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.fillStyle = "#FDF3E3";
        ctx.beginPath();
        ctx.ellipse(0, 0, s.r * 1.5, s.r * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = s.t < s.life * 0.4 ? "#FFD166" : "#F2A0C0";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + k * 0.9), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // a couple of pillows tossed clear of the blast
    if (S.mode === "boom" && pillowImg.complete){
      var t = BOOM_LEN - S.boom;
      ctx.globalAlpha = Math.max(0, 1 - t / 1.2);
      for (var d = 0; d < 2; d++){
        var dirx = d === 0 ? -1 : 1;
        ctx.save();
        ctx.translate(S.boomX + dirx * t * 260, S.boomY - t * 210 + t * t * 300);
        ctx.rotate(t * 5 * dirx);
        ctx.drawImage(pillowImg, -pw / 2, -ph / 2, pw * 2, ph * 2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawBoom(){
    if (S.mode !== "boom") return;
    var t = BOOM_LEN - S.boom;
    var x = S.boomX, y = S.boomY;

    ctx.save();
    // fireball
    if (t < 0.55){
      var fr = 40 + t * 300;
      var g = ctx.createRadialGradient(x, y, 0, x, y, fr);
      var a = 1 - t / 0.55;
      g.addColorStop(0, "rgba(255,252,240," + (a * 0.95).toFixed(3) + ")");
      g.addColorStop(0.35, "rgba(255,209,102," + (a * 0.8).toFixed(3) + ")");
      g.addColorStop(0.7, "rgba(242,160,192," + (a * 0.5).toFixed(3) + ")");
      g.addColorStop(1, "rgba(242,160,192,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, fr, 0, Math.PI * 2); ctx.fill();
    }
    // shock ring
    if (t < 0.8){
      var rr = 30 + t * 620;
      ctx.globalAlpha = Math.max(0, 1 - t / 0.8) * 0.8;
      ctx.strokeStyle = "#FFD166";
      ctx.lineWidth = 12 * Math.max(0.08, 1 - t / 0.8);
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // comic burst
    if (t > 0.14){
      var appear = Math.min(1, (t - 0.14) * 6);
      var fade = Math.max(0, 1 - Math.max(0, t - 1.0) / 0.6);
      ctx.globalAlpha = appear * fade;
      var sc = 0.75 + appear * 0.25 + Math.sin(t * 9) * 0.02;
      ctx.translate(VW / 2, VH / 2 - 20);
      ctx.rotate(-0.06);
      ctx.scale(sc, sc);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '700 96px "Mochiy Pop One", "Zen Maru Gothic", sans-serif';
      ctx.lineJoin = "round";
      ctx.lineWidth = 14;
      ctx.strokeStyle = "#C2687F";
      ctx.strokeText("メー！！", 0, 0);
      ctx.fillStyle = "#FFD166";
      ctx.fillText("メー！！", 0, 0);
    }
    ctx.restore();
  }

  function drawPuffs(){
    for (var i = 0; i < S.puffs.length; i++){
      var q = S.puffs[i];
      var k = 1 - q.t / q.life;
      ctx.globalAlpha = Math.max(0, k) * 0.9;
      ctx.fillStyle = i % 3 === 0 ? "#F2A0C0" : "#FDF3E3";
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.5 + k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHud(){
    ctx.save();
    // scrim so the readout stays legible when a pillow flies past it
    var hg = ctx.createLinearGradient(0, 0, 0, 120);
    hg.addColorStop(0, "rgba(27,18,48,.72)");
    hg.addColorStop(1, "rgba(27,18,48,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, VW, 120);

    ctx.font = '700 15px "Zen Maru Gothic", system-ui, sans-serif';
    ctx.fillStyle = "rgba(253,243,227,.62)";
    ctx.textBaseline = "top";
    ctx.fillText("スコア", 34, 30);
    ctx.fillText("レベル", 150, 30);
    ctx.font = '700 34px "Mochiy Pop One", "Zen Maru Gothic", sans-serif';
    ctx.fillStyle = "#FFD166";
    ctx.fillText(String(S.score), 34, 48);
    ctx.fillStyle = "#D9EAA6";
    ctx.fillText(String(S.level), 150, 48);

    // lives, as heart pillows
    var size = 30;
    for (var i = 0; i < 3; i++){
      var x = VW - 46 - i * (size + 10), y = 44;
      ctx.globalAlpha = i < S.lives ? 1 : 0.2;
      if (pillowImg.complete) ctx.drawImage(pillowImg, x - size, y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    if (S.toast > 0){
      ctx.globalAlpha = Math.min(1, S.toast * 1.6);
      ctx.textAlign = "center";
      ctx.font = '700 30px "Mochiy Pop One", "Zen Maru Gothic", sans-serif';
      ctx.fillStyle = "#F2A0C0";
      ctx.fillText(S.toastText, VW / 2, 150);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function render(){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, VW, VH);

    var sx = 0, sy = 0;
    if (S.shake > 0){
      sx = (Math.random() * 2 - 1) * 12 * S.shake;
      sy = (Math.random() * 2 - 1) * 12 * S.shake;
    }
    ctx.save();
    ctx.translate(sx, sy);

    drawBackground();
    drawChara();
    // pillows fly past in front of her
    for (var i = 0; i < S.pillows.length; i++) drawPillow(S.pillows[i]);
    drawPuffs();
    drawSparks();
    drawBoom();
    ctx.restore();

    drawHud();
  }

  // ---------- loop ----------
  var last = 0;
  function frame(ts){
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function makeFlash(){
    if (!chara.complete || !chara.naturalWidth) return;
    flashCv = document.createElement("canvas");
    flashCv.width = chara.naturalWidth;
    flashCv.height = chara.naturalHeight;
    var fx = flashCv.getContext("2d");
    fx.drawImage(chara, 0, 0);
    fx.globalCompositeOperation = "source-atop";
    fx.fillStyle = "rgba(255,250,232,.92)";
    fx.fillRect(0, 0, flashCv.width, flashCv.height);
  }

  function boot(){
    fit();
    makeFlash();
    showTitle();
    requestAnimationFrame(frame);
  }

  var pending = 2;
  function ready(){ if (--pending <= 0) boot(); }
  chara.onload = ready; chara.onerror = ready;
  pillowImg.onload = ready; pillowImg.onerror = ready;

  // expose a tiny hook for smoke-testing
  window.__game = S;
  window.__api = { start: startGame, spawn: spawn, faceRect: faceRect, speed: pillowSpeed };
})();
</script>
