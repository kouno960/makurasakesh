<title>ガチですかえりこ</title>

<style>
/* layout: one-screen toy — title band, framed portrait, one control row */
:root{
  --bg:#e9edf3; --paper:#ffffff; --ink:#2a211c; --sub:#6b6560; --accent:#d9475b; --line:#2a211c;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(var(--paper) 18%,transparent 19%);background-size:28px 28px;
  -webkit-user-select:none;user-select:none;touch-action:none}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:14px;box-sizing:border-box;max-width:520px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8.5vw,44px);margin:0;letter-spacing:.02em;line-height:1.1;text-align:center;
  color:var(--ink);text-shadow:3px 3px 0 var(--accent)}
h1 span{color:var(--accent);text-shadow:3px 3px 0 var(--ink)}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;container-type:size}
.frame{position:relative;width:min(100cqw,calc(100cqh * 900 / 1064));height:auto;aspect-ratio:900/1064;flex:none;
  background:var(--paper);border:3px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:6px 6px 0 var(--line)}
.frame img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.full{inset:0;width:100%;height:100%}
.pupil{will-change:transform}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:var(--body);font-weight:800;font-size:15px;color:var(--paper);background:var(--accent);border:3px solid var(--line);
  border-radius:999px;padding:9px 18px;box-shadow:3px 3px 0 var(--line);cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button.ghost{background:var(--paper);color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.status{font-size:12px;color:var(--sub);text-align:center;min-height:1.3em;font-weight:500}
</style>

    </div>
  </div>
  <div class="bar">
    <button id="sensor" type="button" aria-pressed="false">スマホを傾けて動かす</button>
    <button id="center" class="ghost" type="button">正面リセット</button>
  </div>
  <div class="status" id="status">画面をなぞっても目が追いかけます</div>
</div>
<script>
(()=>{
  const W=900,H=1064;
  // pupil rest box (900px space) and hole movement range
  const eyes=[{el:p0,x:307,y:330,w:60,h:76,rx:23,ry:11},{el:p1,x:496,y:325,w:60,h:76,rx:23,ry:11}];
  const frame=document.getElementById('frame'), st=document.getElementById('status');
  eyes.forEach(e=>{Object.assign(e.el.style,{left:e.x/W*100+'%',top:e.y/H*100+'%',width:e.w/W*100+'%',height:e.h/H*100+'%'})});

  let tx=0,ty=0, px=0,py=0, vx=0,vy=0;           // target (-1..1), position, velocity
  let mode='idle', lastInput=0, base=null, lastOri=null;
  const clamp=(v,a=1)=>Math.max(-a,Math.min(a,v));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- device tilt
  function onOri(ev){
    if(ev.gamma==null) return;
    lastOri={b:ev.beta,g:ev.gamma};
    if(!base) base={...lastOri};
    tx=clamp((ev.gamma-base.g)/25); ty=clamp((ev.beta-base.b)/20);
    mode='tilt'; lastInput=performance.now();
  }
  function onMotion(ev){
    const a=ev.acceleration; if(!a||a.x==null) return;
    // shake kick: eyes wobble against movement
    vx-=clamp(a.x,15)*0.004; vy+=clamp(a.y,15)*0.004;
    if(Math.abs(a.x)+Math.abs(a.y)>2){mode='tilt';lastInput=performance.now();}
  }
  let sensorOn=false;
  async function enableSensor(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        const r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted'){st.textContent='センサーが許可されませんでした。指でなぞって遊べます';return;}
        try{await DeviceMotionEvent.requestPermission();}catch(e){}
      }
    }catch(e){st.textContent='この画面ではセンサーが使えません。指でなぞって遊べます';return;}
    addEventListener('deviceorientation',onOri);
    addEventListener('devicemotion',onMotion);
    sensorOn=true; base=null; lastOri=null;
    sBtn.textContent='指でなぞって動かす'; sBtn.setAttribute('aria-pressed','true');
    st.textContent='センサー待機中…スマホを傾けてみて';
    setTimeout(()=>{ if(!sensorOn) return; if(!lastOri) st.textContent='センサーの値が来ません（ブラウザ側で制限中かも）。指でなぞって遊べます'; else st.textContent='傾けるとえりこがきょろきょろします'; },1500);
  }
  const sBtn=document.getElementById('sensor');
  function disableSensor(){
    removeEventListener('deviceorientation',onOri);
    removeEventListener('devicemotion',onMotion);
    sensorOn=false; base=null; lastOri=null; tx=ty=0; mode='idle'; lastInput=0;
    sBtn.textContent='スマホを傾けて動かす'; sBtn.setAttribute('aria-pressed','false');
    st.textContent='指でなぞると目が追いかけます';
  }
  sBtn.addEventListener('click',()=>{ sensorOn?disableSensor():enableSensor(); });
  document.getElementById('center').addEventListener('click',()=>{base=lastOri?{...lastOri}:null;tx=ty=0;});

  // --- touch / mouse: look toward the finger
  function look(cx,cy){
    const r=frame.getBoundingClientRect();
    const ex=r.left+r.width*(431/W), ey=r.top+r.height*(366/H);
    tx=clamp((cx-ex)/(r.width*0.45)); ty=clamp((cy-ey)/(r.height*0.45));
    mode='touch'; lastInput=performance.now();
  }
  addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'||e.buttons) look(e.clientX,e.clientY); });
  addEventListener('pointerdown',e=>look(e.clientX,e.clientY));

  // --- idle glancing when nobody is driving
  let nextGlance=0;
  function idle(t){
    if(t>nextGlance){
      const r=Math.random();
      if(r<.35){tx=0;ty=0;} else {tx=(Math.random()*2-1);ty=(Math.random()*1.4-.7);}
      nextGlance=t+600+Math.random()*1600;
    }
  }

  function frameLoop(t){
    if(t-lastInput>2500 && !(sensorOn&&lastOri)) idle(t);
    // spring toward target, a bit bouncy
    const k=reduce?0.25:0.12, d=reduce?0.5:0.72;
    vx=(vx+(tx-px)*k)*d; vy=(vy+(ty-py)*k)*d;
    px+=vx; py+=vy;
    // keep inside an ellipse
    const m=Math.hypot(px,py); const ox=m>1?px/m:px, oy=m>1?py/m:py;
    for(const e of eyes){
      const dx=ox*e.rx/e.w*100, dy=oy*e.ry/e.h*100;
      e.el.style.transform=`translate(${dx}%,${dy}%)`;
    }
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);
})();
</script>
